[project]
name = "appointment-booking-agent"
version = "0.1.0"
description = "LiveKit Voice Agent — Termin-Buchungsassistent mit Google Calendar via Service Account"
requires-python = ">=3.11"

dependencies = [
    "livekit-agents>=1.0.0,<2.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-elevenlabs>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "livekit-plugins-turn-detector>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
