[project]
name = "simple-latency-agent"
version = "0.1.0"
description = "LiveKit Voice Agent — minimale STT→LLM→TTS-Pipeline, latenzoptimiert (Gemini 2.5 Flash Lite + Deepgram EU + Cartesia)"
requires-python = ">=3.11"

dependencies = [
    "livekit-agents>=1.0.0,<2.0.0",
    "livekit-plugins-google>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-cartesia>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "livekit-plugins-turn-detector>=1.0.0",
    "torch>=2.0.0",
    "transformers>=4.35.0",
    "python-dotenv>=1.0.0",
]

[tool.uv]
package = false
